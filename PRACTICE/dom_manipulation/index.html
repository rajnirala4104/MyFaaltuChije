<!doctype html>
<html lang="len">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div
      class="navbarContainer w-full h-[5rem] bg-slate-900 text-white flex items-center justify-center"
    >
      <div
        class="navbar flex items-center justify-between border-blue-500 w-[90%]"
      >
        <div class="logoContainer">
          <div class="font-bold text-4xl">
            <span class="text-red-500 text-4xl">.</span>
            <span class="">demoSite</span>
          </div>
        </div>
        <div class="menuContainer border-green-500 flex w-[26%] px-10">
          <div class="menu flex items-center justify-center w-full">
            <ul
              class="flex w-full items-center justify-between text-lg text-slate-300 *:hover:text-slate-50 *:cursor-pointer"
            >
              <li>Home</li>
              <li>About</li>
              <li>Contact</li>
              <li>Something</li>
            </ul>
          </div>
        </div>
        <div
          class="rightSideBtns w-[15%] flex items-center justify-between px-10"
        >
          <div
            class="btnContainer *:hover:cursor-pointer *:hover:text-gray-950 *:rounded-lg *:px-3 flex justify-between items-center w-full"
          >
            <button
              class="loginBtn px-3 py-1 bg-red-400 text-gray-900 text-xl font-bold text-center"
            >
              Login
            </button>
            <button
              class="signUpBtn px-3 py-1 bg-red-400 text-gray-900 text-xl font-bold text-center"
            >
              Sing Up
            </button>
          </div>
        </div>
      </div>
    </div>
    <section class="crudOpprations">
      <section class="searchBarSection w-full flex items-center justify-center">
        <div
          class="searchBar w-[35%] flex justify-between items-center p-2 flex items-center justify-center border-2 rounded-full border-slate-400 my-3 mt-10"
        >
          <span class="bg-red-500 rounded-full p-4 border border-black">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
              class="text-2xl font-bold"
            >
              <title xmlns="">search</title>
              <path
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0-14 0m18 11l-6-6"
              />
            </svg>
          </span>
          <input
            type="text"
            name="searchBarInputElem"
            id="searchBarInputElem"
            class="searchBarInputElem px-3 py-2 w-full outline-none text-xl text-slate-900"
            placeholder="Search.."
          />
        </div>
      </section>
      <div class="mainContent flex justify-between items-start h-200 mt-10">
        <section class="leftSection w-[70%] h-200">
          <!-- this is card container -->
          <div
            id="noteCardContainer"
            class="noteCardsContainer flex flex-wrap justify-evenly items-center overflow-y-auto overflow-x-hidden h-full"
          ></div>
        </section>

        <div class="h-full border border-gray-600"></div>

        <!-- this is input text area... -->
        <section class="rightSection w-[30%] flex justify-center items-center">
          <div class="my-3 flex flex-col justify-center items-center">
            <input
              id="noteTitleInput"
              type="text"
              name="noteTitle"
              placeholder="write title"
              class="outline-none px-3 py-2 border-2 rounded-lg border-gray-500 active:border-black focus:border-black my-2 w-full text-xl"
            />
            <textarea
              rows="12"
              cols="40"
              id="noteDescrptionTextarea"
              class="border-2 border-gray-500 p-3 rounded-lg outline-none resize-none active:border-black focus:border-black text-xl"
              placeholder="write a description here.."
            ></textarea>
            <div
              class="rightBtnDiv my-4 flex justify-start items-center w-full *:transition-all *:hover:scale-110 *:active:sclae-95 *:duration-300 *:ease-in-out *:px-3 *:py-2 *:border *:border-black *:shadow-lg *:rounded-lg *:font-bold *:text-xl *:text-center *:w-[10rem] *:mr-6"
            >
              <button
                id="addNoteBtn"
                class="addNoteBtn bg-red-400 hover:bg-red-500 text-black"
              >
                Add Note
              </button>
              <button
                id="clearTextBtn"
                class="clearTextBtn bg-white text-black hover:bg-red-500"
              >
                Clear Text
              </button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </body>
  <script>
    console.log("hello duniya..");

    // inputs
    let searchBarInput = document.getElementById("searchBarInputElem");
    let noteTitleInput = document.getElementById("noteTitleInput");
    let noteDescriptionTextarea = document.getElementById(
      "noteDescrptionTextarea",
    );

    // buttons
    let addNoteBtn = document.getElementById("addNoteBtn");
    let clearTextBtn = document.getElementById("clearTextBtn");
    let editNoteBtn = document.getElementById("editNoteBtn");
    let deleteNoteBtn = document.getElementById("deleteNoteBtn");

    // containers or boxes
    let notesContainer = document.getElementById("noteCardContainer");

    const dataIntegrationInCardFunction = (dataObj) => {
      let finalCard = `
                                <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-black p-5 m-2 text-white shadow-xl">
                                  <!-- Header -->
                                  <div class="flex items-start justify-between gap-4">
                                    <div>
                                      <h2 class="text-xl font-bold text-white">${dataObj.noteTitle}</h2>
                                      <p class="mt-2 text-sm leading-relaxed text-gray-400">
                                        ${dataObj.noteDescription}
                                      </p>
                                    </div>
                                    <!-- Note Icon -->
                                    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-red-600">
                                      ${dataObj.noteSno}
                                    </div>
                                  </div>

                                  <!-- Divider -->
                                  <div class="my-5 h-px bg-gray-800"></div>

                                  <!-- Date & Time -->
                                  <div class="flex items-center gap-5 text-sm text-gray-400">
                                    <!-- Date -->
                                    <div class="flex items-center gap-2">
                                      <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="h-4 w-4 text-red-500"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke="currentColor"
                                        stroke-width="2"
                                      >
                                        <path
                                          stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M8 7V3m8 4V3m-9 8h10M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
                                        />
                                      </svg>

                                      <span>${dataObj.date}</span>
                                    </div>

                                    <!-- Time -->
                                    <div class="flex items-center gap-2">
                                      <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="h-4 w-4 text-red-500"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke="currentColor"
                                        stroke-width="2"
                                      >
                                        <path
                                          stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M12 8v4l3 2m6-2a9 9 0 11-18 0 9 9 0 0118 0z"
                                        />
                                      </svg>

                                      <span>${dataObj.time}</span>
                                    </div>
                                  </div>

                                  <!-- Buttons -->
                                  <div class="mt-6 flex gap-3">
                                    <!-- Edit -->
                                    <button id="editNoteBtn" class="flex flex-1 items-center justify-center gap-2 rounded-lg border border-gray-700 bg-white px-4 py-2.5 text-sm font-semibold text-black transition duration-200 hover:scale-[1.02] hover:bg-gray-200 active:scale-95">
                                      <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="h-4 w-4"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke="currentColor"
                                        stroke-width="2"
                                      >
                                        <path
                                          stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.5-9.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 7.5-7.5z"
                                        />
                                      </svg>

                                      Edit
                                    </button>

                                    <!-- Delete -->
                                    <button id="deleteNoteBtn" class="flex flex-1 items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition duration-200 hover:scale-[1.02] hover:bg-red-700 active:scale-95">
                                      <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        class="h-4 w-4"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke="currentColor"
                                        stroke-width="2"
                                      >
                                        <path
                                          stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M6 7h12m-9 0V5a1 1 0 011-1h2a1 1 0 011 1v2m2 0v12a2 2 0 01-2 2H9a2 2 0 01-2-2V7m3 4v6m4-6v6"
                                        />
                                      </svg>

                                      Delete
                                    </button>
                                  </div>
                                </div>


                    `;
      return finalCard;
    };

    // ---------------------- Utility Functions start -----------------
    // ---- date Format function -----
    const dateFormat = () => {
      const date = new Date();

      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];

      const formattedDate =
        `${String(date.getDate()).padStart(2, "0")} ` +
        `${months[date.getMonth()]} ` +
        `${date.getFullYear()}`;

      return formattedDate;
    };

    // ----- Time format Function -----------
    const timeFormat = () => {
      const date = new Date();

      const formattedTime = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true,
      }).format(date);

      return formattedTime;
    };

    // ---- Adding notes in localStorage ------
    const addNoteToLocalStorage = (name, data) => {
      let localData = JSON.parse(localStorage.getItem(name));
      if (localData == null) {
        return localStorage.setItem(name, JSON.stringify([data]));
      } else {
        return localStorage.setItem(name, JSON.stringify([data, ...localData]));
      }
    };

    // -------------------- utility Functions end -----------------------------------

    const addNoteFunction = () => {
      let localData = JSON.parse(localStorage.getItem("notes"));
      let noteObj = {};
      let noteSno = 0;

      addNoteBtn.addEventListener("click", () => {
        if (localData === null) {
          noteObj.noteSno = noteSno++;
        } else {
          noteObj.noteSno = localData.length + 1;
        }

        noteObj.noteTitle = noteTitleInput.value;
        noteObj.noteDescription = noteDescriptionTextarea.value;
        noteObj.date = dateFormat();
        noteObj.time = timeFormat();

        addNoteToLocalStorage("notes", noteObj);
        //console.log(localStorage.getItem("notes"));

        noteTitleInput.value = "";
        noteDescriptionTextarea.value = "";

        window.location.reload();
      });
    };

    const renderAllNotes = () => {
      let localData = JSON.parse(localStorage.getItem("notes"));

      if (localData === null) {
        return -1;
      } else {
        Array.from(
          JSON.parse(localStorage.getItem("notes")).sort(
            (a, b) => a.noteSno - b.noteSno,
          ),
        ).forEach((singleNoteObj) => {
          notesContainer.innerHTML +=
            dataIntegrationInCardFunction(singleNoteObj);
        });
      }
    };

    renderAllNotes();
    addNoteFunction();
  </script>
</html>
